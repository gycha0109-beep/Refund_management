name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Syntax check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Public plugin secret guard
        shell: bash
        run: |
          if grep -Eq 'refundmanagement-production\.up\.railway\.app|ROBLOX_WEBHOOK_SECRET[[:space:]]*=' plugin/RefundLogger.plugin.lua; then
            echo "Public plugin contains a maintainer endpoint or webhook secret marker."
            exit 1
          fi
          if grep -Eq 'local DEFAULT_API = "[^"]+"' plugin/RefundLogger.plugin.lua; then
            echo "Public plugin must not ship with a default backend URL."
            exit 1
          fi
